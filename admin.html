<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Paneli</title>

    <link rel="stylesheet" href="style.css?v=2">

</head>


<body>

<div class="container">

    <h1>Admin Paneli</h1>


    <div id="login">

        <input
            id="email"
            type="email"
            placeholder="E-posta"
        >

        <br><br>

        <input
            id="password"
            type="password"
            placeholder="Şifre"
        >

        <button onclick="login()">
            Giriş Yap
        </button>

        <p id="loginMessage"></p>

    </div>


    <div id="panel" style="display:none;">

        <h2>Geri Bildirimler</h2>

        <div id="feedbacks"></div>

        <button onclick="logout()">
            Çıkış Yap
        </button>

    </div>

</div>


<script type="module">

import { createClient }

from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://lihnkpmkwyqacusugruf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_I6XwKsw7KeGUcZGYU-uQSQ_215eEJ9a";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


window.login = async function () {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const { error } =
        await supabase.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        document.getElementById("loginMessage")
            .textContent = "Giriş başarısız.";

        return;
    }


    document.getElementById("login")
        .style.display = "none";

    document.getElementById("panel")
        .style.display = "block";


    loadFeedbacks();

};


async function loadFeedbacks() {

    const { data, error } =
        await supabase
            .from("feedback")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        return;
    }


    const container =
        document.getElementById("feedbacks");


    container.innerHTML = "";


    data.forEach(item => {

        const div =
            document.createElement("div");


        div.style.background = "#374151";
        div.style.padding = "15px";
        div.style.marginTop = "15px";
        div.style.borderRadius = "10px";


        div.innerHTML = `

            <strong>Düzeltilmesi gereken:</strong>

            <p>
                ${escapeHTML(item.correction || "Yok")}
            </p>


            <strong>Eklenmesi gereken:</strong>

            <p>
                ${escapeHTML(item.addition || "Yok")}
            </p>


            <small>
                ${new Date(item.created_at).toLocaleString("tr-TR")}
            </small>

        `;


        container.appendChild(div);

    });

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


window.logout = async function () {

    await supabase.auth.signOut();

    location.reload();

};


supabase
    .channel("feedback-live")
    .on(
        "postgres_changes",
        {
            event: "INSERT",
            schema: "public",
            table: "feedback"
        },
        () => {

            loadFeedbacks();

        }
    )
    .subscribe();


</script>

</body>

</html>
